[package]
name = "wdk_mutex_tests"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[dependencies]
wdk = "0.3"
wdk-alloc = "0.3"
wdk-panic = "0.3" 
wdk-sys = "0.4"
wdk-mutex = { git = "https://github.com/0xflux/wdk-mutex", rev = "4dfbbe16e04687bfc9ecb6b90b1f798569aa83e7" }

[build-dependencies]
wdk-build = "0.4"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]