[package]
name = "wdk_mutex_tests"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[dependencies]
wdk = "0.4"
wdk-alloc = "0.4"
wdk-panic = "0.4" 
wdk-sys = "0.5"
wdk-mutex = "1.3.2"
# wdk-mutex = { path = "../wdk_mutex", version = "1.3.2" }

[build-dependencies]
wdk-build = "0.5"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]