[package]
name = "wdk_mutex_tests"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]
test = false

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[dependencies]
wdk = "0.3"
wdk-alloc = "0.3"
wdk-panic = "0.3"
wdk-sys = "0.4"
wdk-mutex = { git = "https://github.com/0xflux/wdk-mutex", rev = "918849d132aed6d284b6435c069d40dca89d38ab" }

[build-dependencies]
wdk-build = "0.4"

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true

[features]
default = []
nightly = ["wdk/nightly", "wdk-sys/nightly"]